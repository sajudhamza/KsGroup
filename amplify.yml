version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
  customRedirects:
    - source: '/fishbowl'
      target: '/fishbowl/'
      status: '302'
    - source: '/rickey'
      target: '/rickey/'
      status: '302'
