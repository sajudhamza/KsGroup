version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
  customRedirects:
    - source: '/api/xotelo/<*>'
      target: 'https://data.xotelo.com/api/<*>'
      status: '200'
    - source: '/api/liteapi/<*>'
      target: 'https://api.liteapi.travel/v3.0/<*>'
      status: '200'
    - source: '/maine-grill'
      target: '/maine-grill/'
      status: '302'
    - source: '/maine-grill/<*>'
      target: '/maine-grill/index.html'
      status: '200'
